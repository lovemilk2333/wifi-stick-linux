name: Build OpenStick kernel images

# Single entry point for both modes. GitHub cannot show/hide workflow_dispatch
# inputs based on another input, so the form always shows every option and the
# only_build_kernel checkbox decides whether the shared rootfs.img is produced.
# The build steps live in build-openstick-kernel-build.yml.

on:
  workflow_dispatch:
    inputs:
      root_password:
        description: Root password for the generated rootfs (only affects the rootfs artifact)
        required: true
        default: "12345678"
        type: string
      localversion:
        description: CONFIG_LOCALVERSION value, including a leading hyphen when wanted
        required: true
        default: -handsomekernel-dezigenb-rebuild
        type: string
      clean_build:
        description: Delete the matching ccache entry and compile from scratch
        required: true
        default: false
        type: boolean
      enable_rndis_ms_iad:
        description: Apply patch/rndis-ms-iad_desc.patch (RNDIS as Microsoft Wireless Controller 0xE0/01/03) before building
        required: true
        default: true
        type: boolean
      timezone:
        description: Timezone for the generated rootfs
        required: true
        default: Asia/Taipei
        type: string
      language:
        description: Display language for the generated rootfs
        required: true
        default: zh_cn
        type: choice
        options:
          - zh_cn
          - en_us
      apt_mirror:
        description: Debian mirror URL of rootfs distribution, without the distribution path
        required: true
        default: https://mirror.nju.edu.cn/debian
        type: string
      upload_deb:
        description: Upload the built Linux Debian packages as a separate artifact
        required: true
        default: true
        type: boolean
      only_build_kernel:
        description: Build kernel, Debian packages and per-device boot images, but skip the OpenStick root filesystem image
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  build:
    uses: ./.github/workflows/build-openstick-kernel-build.yml
    with:
      only_build_kernel: ${{ inputs.only_build_kernel }}
      root_password: ${{ inputs.root_password }}
      localversion: ${{ inputs.localversion }}
      clean_build: ${{ inputs.clean_build }}
      enable_rndis_ms_iad: ${{ inputs.enable_rndis_ms_iad }}
      timezone: ${{ inputs.timezone }}
      language: ${{ inputs.language }}
      apt_mirror: ${{ inputs.apt_mirror }}
      upload_deb: ${{ inputs.upload_deb }}
