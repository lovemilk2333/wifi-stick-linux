# 编译 UFI 设备(OpenStick msm8916 系列)Debian 固件 —— 内核 + boot.img 部分
#
# 对应教程:workspace/编译UFI设备的Debian固件 _ 宁宁's Blog.html
# 流程:checkout 本内核源码 → (可选)应用 patch/rndis-ms-iad_desc.patch →
#       内核配置(默认 kernel-rebuild.config,可切 msm8916_defconfig,
#       +可选额外 CONFIG)交叉编译 → make-kpkg 打包 deb →
#       下载 OpenStick 底包 debian.zip → simg2img + qemu chroot 装入新内核、
#       生成匹配的 initrd → 取出 initrd → cat Image.gz+dtb 并用 mkbootimg
#       合成 <device>-boot.img → 上传 deb / Image.gz / dtb / boot.img
#
# 注意:
#   * 教程用的 ubuntu-20.04 runner 已被 GitHub 移除,这里用 ubuntu-22.04
#     (交叉编译器 gcc-11;本内核 5.15 可正常编译)
#   * jammy 仓库无 kernel-package(make-kpkg),安装步骤会从 Ubuntu archive
#     pool 直接下载其纯脚本 deb 安装,教程的 make-kpkg 流程不变
#   * OpenStick 官方 arm64 固件即纯 msm8916_defconfig 构建(.drone.sh),
#     defconfig 内已含 CONFIG_LOCALVERSION="-handsomekernel" 等设备定制,
#     arch/arm/configs/msm8916_defconfig.part 是 ARM32 专用片段,不适用
#   * 默认使用仓库根目录 kernel-rebuild.config —— 从本地成功构建导出的完整
#     .config(等价于 defconfig + menuconfig 手工改动,额外启用了 CAN/USB serial
#     等;CONFIG_LOCALVERSION="-handsomekernel-dezigenb-rebuild"),构建时经
#     olddefconfig 用当前工具链(gcc-11)重新解析;如需改回纯 defconfig 关掉
#     use_rebuild_config 输入即可
#   * 本 workflow 不重新打包 rootfs.img,底包只用于 chroot 安装内核以生成
#     与内核匹配的 initrd
#   * 内核对 rootfs 的挂载参数沿用教程(四个设备通用同一 cmdline)

name: Build UFI firmware (kernel + boot)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 目标设备(决定使用哪个 dtb)
        type: choice
        options:
          - ufi001c
          - ufi001b
          - sp970
          - uz801
        default: ufi001c
      rndis_ms_iad:
        description: 构建前对源码应用 patch/rndis-ms-iad_desc.patch(将 RNDIS 控制接口枚举改为微软规范的 Wireless Controller 0xE0/01/03)
        type: boolean
        default: true
      use_rebuild_config:
        description: 使用仓库根目录 kernel-rebuild.config(本地成功构建导出的完整 .config,含 CAN/USB serial 等扩展);关闭则退化为纯 msm8916_defconfig
        type: boolean
        default: true
      extra_config:
        description: 额外的内核配置,每行一个 CONFIG_*(叠加在当前所选配置之上),如 CONFIG_USB_CONFIGFS_F_FS=y;留空则不追加
        type: string
        default: ''
      cmdline:
        description: mkbootimg 使用的内核 cmdline(默认取自教程,rootfs 分区 PARTUUID 不变)
        type: string
        default: 'earlycon root=PARTUUID=a7ab80e8-e9d1-e8cd-f157-93f69b1d141e console=ttyMSM0,115200 no_framebuffer=true rw'

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

concurrency:
  group: build-ufi-${{ inputs.device }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ufi firmware (${{ inputs.device }})
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout 内核源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装依赖
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex bc pkg-config libncurses-dev libssl-dev \
            gcc-aarch64-linux-gnu fakeroot \
            android-sdk-libsparse-utils mkbootimg \
            qemu-user-static binfmt-support unzip
          # kernel-package 在 jammy 仓库已被移除(教程基于 20.04 的 make-kpkg),
          # 直接从 Ubuntu archive pool 安装其纯脚本包(Architecture: all,
          # 依赖 build-essential/po-debconf/xmlto 等,均由 jammy 源解析提供)
          kpkg_deb=$(curl -fsSL --max-time 30 \
              http://archive.ubuntu.com/ubuntu/pool/universe/k/kernel-package/ \
            | grep -oE 'kernel-package_[0-9][^"]*_all\.deb' | sort -V | tail -1)
          [ -n "$kpkg_deb" ] || { echo "::error::archive pool 中找不到 kernel-package"; exit 1; }
          curl -fsSL --max-time 60 -o /tmp/kpkg.deb \
            "http://archive.ubuntu.com/ubuntu/pool/universe/k/kernel-package/$kpkg_deb"
          sudo apt-get install -y --no-install-recommends /tmp/kpkg.deb
          command -v make-kpkg || { echo "::error::kernel-package 安装失败"; exit 1; }
          # 注册 aarch64 binfmt(qemu chroot 用),两种注册方式择一即可
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || \
            sudo systemctl restart systemd-binfmt || true

      - name: 应用 RNDIS 微软规范 patch(可选)
        if: ${{ inputs.rndis_ms_iad == 'true' }}
        run: git apply patch/rndis-ms-iad_desc.patch

      - name: 内核基础配置
        shell: bash
        run: |
          if [ "${{ inputs.use_rebuild_config }}" = "true" ]; then
            # 完整 .config 已含 defconfig 的全部内容,olddefconfig 负责用当前
            # 工具链(gcc-11)重排并刷新编译器相关探测项
            cp kernel-rebuild.config .config
            make olddefconfig
          else
            make msm8916_defconfig
          fi
          # 版本号随配置而定: 5.15.0-handsomekernel 或
          # 5.15.0-handsomekernel-dezigenb-rebuild,供后续步骤取 initrd/deb
          echo "KREL=$(make -s kernelrelease)" >> "$GITHUB_ENV"

      - name: 追加用户提供的额外 CONFIG
        if: ${{ inputs.extra_config != '' }}
        shell: bash
        run: |
          while IFS= read -r line; do
            line="${line%%#*}"                      # 去掉行内注释
            line="$(echo "$line" | tr -d '[:space:]')"
            [ -z "$line" ] && continue
            case "$line" in
              # scripts/config 接受带或不带 CONFIG_ 前缀的符号名
              CONFIG_*=y) scripts/config --enable  "${line%=*}" ;;
              CONFIG_*=m) scripts/config --module  "${line%=*}" ;;
              CONFIG_*=n) scripts/config --disable "${line%=*}" ;;
              *) echo "::warning title=忽略无法识别的配置行::$line";;
            esac
          done <<< "${{ inputs.extra_config }}"
          make olddefconfig

      - name: 校验额外配置是否生效(仅提示,不中断)
        if: ${{ inputs.extra_config != '' }}
        shell: bash
        run: |
          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(echo "$line" | tr -d '[:space:]')"
            [ -z "$line" ] && continue
            case "$line" in
              CONFIG_*=*)
                name="${line%%=*}"; want="${line#*=}"
                if grep -qE "^#?${name}=" .config; then
                  got="$(sed -n "s/^#\?${name}=//p" .config)"
                  [ "$got" = "$want" ] && echo "OK   $name=$want" \
                    || echo "::warning title=配置未生效::$name 期望 $want,实际 $(grep -E "^#?${name}=" .config | head -1)"
                else
                  echo "::warning title=配置不存在::$name(可能被依赖项约束,或拼写有误)"
                fi;;
            esac
          done <<< "${{ inputs.extra_config }}"

      - name: 编译内核(含 dtb)
        run: |
          make -j$(nproc)
          make dtbs
        # make dtbs:arm64 下默认目标已含 Image.gz,此处显式确保 dtb 生成

      - name: make-kpkg 打包 deb(linux-image / linux-headers)
        run: |
          fakeroot make-kpkg --initrd --cross-compile "${CROSS_COMPILE}" --arch arm64 \
            kernel_image kernel_headers
        # deb 生成在源码目录上一层: ${{ github.workspace }}/../*.deb

      - name: 下载 OpenStick 底包并解出 rootfs
        run: |
          mkdir -p "$HOME/fw"
          cd "$HOME/fw"
          wget -q --show-progress https://github.com/OpenStick/OpenStick/releases/download/v1/debian.zip
          unzip -q debian.zip
          ls -la

      - name: 转换并挂载 rootfs
        run: |
          cd "$HOME/fw"
          # OpenStick 的 rootfs.img 为 Android sparse 格式,非 sparse 时直接复制
          if ! simg2img rootfs.img root.img 2>/dev/null; then
            echo "rootfs.img 不是 sparse 镜像,直接使用原文件"
            cp -f rootfs.img root.img
          fi
          sudo mkdir -p rootmnt
          sudo mount -o loop root.img rootmnt
          sudo mount --bind /proc rootmnt/proc
          sudo mount --bind /sys  rootmnt/sys
          sudo mount --bind /dev  rootmnt/dev
          sudo mount --bind /dev/pts rootmnt/dev/pts

      - name: Chroot 安装新内核生成匹配 initrd
        run: |
          sudo cp "${{ github.workspace }}"/../linux-*.deb "$HOME/fw/rootmnt/tmp/"
          sudo chroot "$HOME/fw/rootmnt" /bin/bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            # 先卸载底包自带的内核 deb(其 /boot 下旧 initrd/vmlinuz 随之清除)
            dpkg -l | grep -E "linux-(headers|image)" | awk "{print \$2}" | xargs -r dpkg -P
            dpkg -i /tmp/linux-image-*.deb /tmp/linux-headers-*.deb
          '

      - name: 取出 initrd 并卸载清理
        run: |
          ls -la "$HOME/fw/rootmnt/boot/"
          # 旧内核已随 dpkg -P 移除,此处应只剩新内核生成的 initrd
          sudo cp "$HOME/fw/rootmnt/boot/initrd.img-${KREL}"* "$HOME/fw/initrd.img"
          sudo umount "$HOME/fw/rootmnt/dev/pts" 2>/dev/null || true
          sudo umount "$HOME/fw/rootmnt/dev"     2>/dev/null || true
          sudo umount "$HOME/fw/rootmnt/proc"    2>/dev/null || true
          sudo umount "$HOME/fw/rootmnt/sys"     2>/dev/null || true
          sudo umount "$HOME/fw/rootmnt"         2>/dev/null || true

      - name: 组装 boot 镜像
        run: |
          cd "$HOME/fw"
          # Image.gz 与 dtb 拼接(内核自带 appended dtb 支持)
          cat "${{ github.workspace }}/arch/arm64/boot/Image.gz" \
              "${{ github.workspace }}/arch/arm64/boot/dts/qcom/msm8916-handsome-openstick-${{ inputs.device }}.dtb" \
              > kernel-dtb
          mkbootimg \
            --base 0x80000000 \
            --kernel_offset 0x00080000 \
            --ramdisk_offset 0x02000000 \
            --tags_offset 0x01e00000 \
            --pagesize 2048 \
            --second_offset 0x00f00000 \
            --ramdisk initrd.img \
            --cmdline "${{ inputs.cmdline }}" \
            --kernel kernel-dtb \
            -o "${{ inputs.device }}-boot.img"
          ls -la

      - name: 收集产物
        run: |
          mkdir -p "${{ github.workspace }}/out"
          cp "$HOME/fw/${{ inputs.device }}-boot.img" "${{ github.workspace }}/out/"
          cp "$HOME/fw/initrd.img"                     "${{ github.workspace }}/out/"
          cp "${{ github.workspace }}/arch/arm64/boot/Image.gz" "${{ github.workspace }}/out/"
          cp "${{ github.workspace }}/arch/arm64/boot/dts/qcom/msm8916-handsome-openstick-${{ inputs.device }}.dtb" \
             "${{ github.workspace }}/out/"
          cp "${{ github.workspace }}"/../linux-*.deb   "${{ github.workspace }}/out/"

      - name: 上传构件
        uses: actions/upload-artifact@v4
        with:
          name: ufi-${{ inputs.device }}-kernel
          path: |
            out/${{ inputs.device }}-boot.img
            out/initrd.img
            out/Image.gz
            out/*.dtb
            out/linux-*.deb

      - name: 构建摘要
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 构建完成: ${{ inputs.device }}
          - 内核: \`${KREL}\` (RNDIS patch: ${{ inputs.rndis_ms_iad }})
          - \`${{ inputs.device }}-boot.img\`:刷机用 boot 分区镜像(bootloader 分区刷入)
          - \`initrd.img\` / \`Image.gz\` / dtb / deb:备查构件
          - 本产物为"内核 + boot",rootfs.img 未重新打包;
            刷机时沿用底包 debian.zip 的 rootfs,并注意 boot cmdline 中
            PARTUUID=\`a7ab80e8-e9d1-e8cd-f157-93f69b1d141e\` 需与设备分区一致
          EOF
